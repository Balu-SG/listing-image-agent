[project]
name = "listing-image-agent"
version = "0.1.0"
description = "Agent that makes product listing images marketplace-compliant without changing the product (OpenCV 5 + AWS)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "opencv-contrib-python==5.0.0.93",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = false
