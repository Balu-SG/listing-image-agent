[project]
name = "listing-image-agent"
version = "0.1.0"
description = "Agent that makes product listing images marketplace-compliant without changing the product (OpenCV 5 + AWS)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.1.0",
    "boto3>=1.43.117",
    "fastapi>=0.159.1",
    "mangum>=0.22.0",
    "numpy>=2.5.4",
    "opencv-contrib-python-headless==5.0.0.93",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = false
