AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Listing Image Compliance Agent - OpenCV 5 on Lambda, Claude on Bedrock

Parameters:
  Planner:
    Type: String
    AllowedValues: [claude, rules]
    Default: claude
  AgentModel:
    Type: String
    Default: claude-opus-4-6-v1
    Description: Claude model id; the Bedrock client turns it into the au. inference profile in Sydney.
      The account's free plan allows Opus 4.6 / Sonnet 4.5 / Haiku 4.5, not the 5.x models.
  AgentEffort:
    Type: String
    Default: low
  BedrockRegion:
    Type: String
    Default: ap-southeast-2   # the account's free-plan region; Claude is called via the au. inference profile
  DailyClaudeLimit:
    Type: Number
    Default: 200
    Description: Claude-planned fixes per day; after that the rule planner takes over
  AlertEmail:
    Type: String
    Description: Where the monthly budget alert is sent

Globals:
  Function:
    Timeout: 300
    MemorySize: 3008
    Architectures: [arm64]

Resources:
  ResultsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-demo-uploads
            Status: Enabled
            Prefix: results/
            ExpirationInDays: 30

  ResultsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH

  AgentFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ..
      Dockerfile: infra/Dockerfile
    Properties:
      FunctionName: !Sub ${AWS::StackName}-agent
      PackageType: Image
      ReservedConcurrentExecutions: 5   # hard ceiling on parallel work (and cost) for a public demo
      Environment:
        Variables:
          RESULTS_BUCKET: !Ref ResultsBucket
          RESULTS_TABLE: !Ref ResultsTable
          PLANNER: !Ref Planner
          AGENT_BACKEND: bedrock
          AGENT_MODEL: !Ref AgentModel
          AGENT_EFFORT: !Ref AgentEffort
          BEDROCK_REGION: !Ref BedrockRegion
          DAILY_CLAUDE_LIMIT: !Ref DailyClaudeLimit
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ResultsBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref ResultsTable
        - Statement:
            - Effect: Allow   # au. cross-region profiles route to Australian regions; the model ARN is region-less
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*
                - arn:aws:bedrock:*::foundation-model/anthropic.*
            - Effect: Allow
              Action: lambda:InvokeFunction    # asynchronous self-invocation for fix jobs
              Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-agent
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
        Warmup:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Input: '{"warmup": true}'
            Enabled: false             # turn on during judging to avoid cold starts

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: [GET, POST]
        AllowHeaders: [content-type]

  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  WebOriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-web
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !Ref WebOriginAccess
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # AWS managed CachingOptimized

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${WebBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub ${AWS::StackName}-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: 20, Unit: USD }
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 50
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]

Outputs:
  ApiUrl:
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  WebUrl:
    Value: !Sub https://${WebDistribution.DomainName}
  WebBucketName:
    Value: !Ref WebBucket
  ResultsBucketName:
    Value: !Ref ResultsBucket
  ResultsTableName:
    Value: !Ref ResultsTable
